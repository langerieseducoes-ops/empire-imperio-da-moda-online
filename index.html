<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#050505">

<meta name="description" content="EMPIRE | Império da Moda Online">


<title>EMPIRE | Império da Moda Online</title>



<link rel="icon" href="assets/img/favicon.png">





<!-- FONTES -->

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">





<!-- ÍCONES -->

<link rel="stylesheet"

href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">





<!-- CSS LOGIN -->

<link rel="stylesheet" href="assets/css/login.css">



</head>






<body>








<!-- ==================================================
LOADER PREMIUM
================================================== -->


<div class="loader" id="loader">



<div class="loader-content">



<div class="loader-logo">

EMPIRE

</div>




<div class="loader-subtitle">

Império da Moda Online

</div>






<div class="loader-line">


<span></span>


</div>





</div>



</div>









<!-- ==================================================
FUNDO ANIMADO
================================================== -->


<div class="background-animation">



<div class="glow glow-1"></div>


<div class="glow glow-2"></div>


<div class="glow glow-3"></div>



<div id="particles"></div>



</div>









<!-- ==================================================
LOGIN
================================================== -->


<main class="login-container">





<section class="login-card">







<div class="login-brand">





<img src="assets/img/logo.png"

alt="Logo Empire">






<h1>

EMPIRE

</h1>






<span>

Império da Moda Online

</span>






</div>





<!-- ==================================================
FORMULÁRIO LOGIN
================================================== -->


<form id="loginForm" class="login-form">







<div class="input-group">



<label>

Usuário

</label>





<div class="input-box">



<i class="fa-solid fa-user"></i>




<input

type="text"

id="username"

placeholder="Digite seu usuário"

autocomplete="username"

required>



</div>



</div>








<div class="input-group">



<label>

Senha

</label>





<div class="input-box">



<i class="fa-solid fa-lock"></i>





<input

type="password"

id="password"

placeholder="Digite sua senha"

autocomplete="current-password"

required>






<button

type="button"

id="showPassword"

class="password-toggle">



<i class="fa-solid fa-eye"></i>



</button>





</div>



</div>









<div class="login-options">





<label class="remember">



<input

type="checkbox"

id="rememberUser">



<span>

Lembrar usuário

</span>



</label>









<a href="pages/html/recuperar-senha.html">


Esqueci minha senha

</a>







</div>









<button

type="submit"

class="login-button"

id="loginButton">





<i class="fa-solid fa-right-to-bracket"></i>




Entrar





</button>








<div id="loginMessage" class="login-message">





</div>






</form>







</section>






</main>







<!-- ==================================================
SCRIPTS
================================================== -->


<script src="assets/js/login.js"></script>








<!-- ==================================================
PWA SERVICE WORKER
================================================== -->


<script>


if("serviceWorker" in navigator){


window.addEventListener(

"load",

()=>{


navigator.serviceWorker.register(

"service-worker.js"

)

.then(()=>{


console.log(

"EMPIRE ERP PWA ativo"

);



})


.catch(error=>{


console.error(

"Erro PWA:",

error

);



});



}



);



}



</script>








</body>

</html>
