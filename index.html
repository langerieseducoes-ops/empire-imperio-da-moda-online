<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#050505">

<meta
    name="description"
    content="EMPIRE ERP - Império da Moda Online"
>

<title>EMPIRE | Império da Moda Online</title>

<link
    rel="icon"
    href="assets/img/favicon.png"
>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
>

<link
    rel="stylesheet"
    href="assets/css/login.css"
>

</head>


<body>


<!-- LOADER -->

<div
    class="loader"
    id="loader"
>

    <div class="loader-content">

        <div class="loader-logo">
            EMPIRE
        </div>

        <div class="loader-subtitle">
            Império da Moda Online
        </div>

        <div class="loader-line">
            <span></span>
        </div>

    </div>

</div>


<!-- FUNDO -->

<div class="login-background">

    <div class="login-glow glow-one"></div>

    <div class="login-glow glow-two"></div>

</div>


<!-- LOGIN -->

<main class="login-container">


    <!-- MARCA -->

    <section class="login-brand">

        <img
            src="assets/img/logo.png"
            alt="EMPIRE"
            class="logo-empresa"
        >

        <h1>
            EMPIRE
        </h1>

        <p>
            Império da Moda Online
        </p>

    </section>


    <!-- CARD -->

    <section class="login-card">


        <div class="login-header">

            <span>
                ACESSO RESTRITO
            </span>

            <h2>
                Entrar no Sistema
            </h2>

            <p>
                Acesse o painel de gestão do EMPIRE ERP.
            </p>

        </div>


        <!-- FORMULÁRIO -->

        <form id="loginForm">


            <!-- USUÁRIO -->

            <div class="form-group">

                <label for="username">
                    Usuário
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Digite seu usuário"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>


            <!-- SENHA -->

            <div class="form-group">

                <label for="password">
                    Senha
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="password-button"
                        aria-label="Mostrar senha"
                    >

                        <i class="fa-solid fa-eye"></i>

                    </button>

                </div>

            </div>


            <!-- MENSAGEM -->

            <div
                class="login-message"
                id="loginMessage"
            ></div>


            <!-- ENTRAR -->

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >

                <i class="fa-solid fa-right-to-bracket"></i>

                Entrar no Sistema

            </button>


        </form>


        <!-- RECUPERAÇÃO -->

        <div class="login-links">

            <a
                href="pages/html/recuperar-senha.html"
                target="_blank"
                rel="noopener"
            >

                <i class="fa-solid fa-key"></i>

                Esqueci minha senha

            </a>

        </div>


        <!-- AVISO -->

        <div class="login-security">

            <i class="fa-solid fa-shield-halved"></i>

            <span>
                A redefinição de senha necessita de autorização do administrador.
            </span>

        </div>


    </section>


    <!-- RODAPÉ -->

    <footer class="login-footer">

        <strong>
            EMPIRE ERP
        </strong>

        <span>
            © 2026 Império da Moda Online
        </span>

    </footer>


</main>


<script src="assets/js/login.js"></script>


</body>

</html>
