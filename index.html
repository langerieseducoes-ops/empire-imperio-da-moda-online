<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EMPIRE ERP | Login</title>


<link rel="icon" href="assets/img/favicon.png">


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<link rel="stylesheet" href="assets/css/login.css">


</head>


<body>



<!-- LOADER -->

<div class="loader" id="loader">


<div class="loader-box">


<h1>

EMPIRE

</h1>


<span>

Império da Moda Online

</span>



<div class="loader-line">

<div></div>

</div>


</div>


</div>







<!-- FUNDO ANIMADO -->


<div class="background">


<div class="light light1"></div>

<div class="light light2"></div>

<div class="light light3"></div>


<div id="particles"></div>


</div>









<!-- LOGIN -->


<main class="login-container">



<section class="login-card">





<div class="logo-area">


<img src="assets/img/logo.png"
alt="Logo Empire">


<h1>

EMPIRE

</h1>


<p>

Império da Moda Online

</p>



</div>







<form id="loginForm">





<div class="input-box">


<i class="fa-solid fa-user"></i>


<input

type="text"

id="usuario"

placeholder="Usuário"

required>


</div>








<div class="input-box">


<i class="fa-solid fa-lock"></i>


<input

type="password"

id="senha"

placeholder="Senha"

required>



<button

type="button"

id="mostrarSenha">


<i class="fa-solid fa-eye"></i>


</button>



</div>








<div id="mensagem">

</div>







<button

class="btn-login"

type="submit">


<span>

ENTRAR

</span>


<i class="fa-solid fa-arrow-right"></i>



</button>






</form>







<a href="recuperar-senha.html"

class="forgot">


<i class="fa-solid fa-key"></i>


Esqueci minha senha


</a>






</section>


</main>








<footer>


<strong>

EMPIRE ERP

</strong>


<br>

Sistema de Gestão


</footer>







<script src="assets/js/login.js"></script>






<script>


const particles = document.getElementById("particles");


for(let i=0;i<40;i++){


let p=document.createElement("span");


p.className="particle";


p.style.left=Math.random()*100+"%";


p.style.animationDelay=Math.random()*8+"s";


p.style.animationDuration=(5+Math.random()*10)+"s";


particles.appendChild(p);


}




</script>





</body>

</html>
