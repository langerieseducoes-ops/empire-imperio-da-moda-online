<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<meta name="theme-color" content="#050505">


<meta name="description" content="EMPIRE ERP - Império da Moda Online">



<title>EMPIRE ERP | Login</title>




<link rel="icon" href="assets/img/favicon.png">





<!-- FONTES -->

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>



<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">






<!-- ÍCONES -->

<link rel="stylesheet"

href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">






<!-- CSS LOGIN -->

<link rel="stylesheet"

href="assets/css/login.css">



</head>






<body>





<!-- ================================================
LOADER PREMIUM
================================================ -->


<div class="login-loader" id="loginLoader">



<div class="loader-content">



<div class="loader-logo">

EMPIRE

</div>




<div class="loader-subtitle">

Império da Moda Online

</div>





<div class="loader-progress">

<span></span>

</div>



</div>


</div>







<!-- ================================================
FUNDO ANIMADO
================================================ -->



<div class="login-background">



<div class="gold-light light-one"></div>


<div class="gold-light light-two"></div>


<div class="gold-light light-three"></div>





<div class="particles" id="particles"></div>




</div>





<!-- ================================================
LOGIN CONTAINER
================================================ -->


<main class="login-container">






<div class="login-card">







<!-- LOGO -->


<div class="login-brand">


<h1>

EMPIRE

</h1>


<span>

Império da Moda Online

</span>



</div>







<!-- FORMULÁRIO -->


<form id="loginForm">







<div class="input-group">


<i class="fa-solid fa-user"></i>



<input

type="text"

id="username"

placeholder="Usuário"

autocomplete="username"

required>


</div>








<div class="input-group">


<i class="fa-solid fa-lock"></i>



<input

type="password"

id="password"

placeholder="Senha"

autocomplete="current-password"

required>



<button

type="button"

class="show-password"

id="showPassword">


<i class="fa-solid fa-eye"></i>


</button>



</div>








<!-- MENSAGEM -->



<div class="login-message"

id="loginMessage">


</div>









<button

type="submit"

class="login-button">



<span>

ENTRAR

</span>



<i class="fa-solid fa-arrow-right"></i>



</button>







</form>








<!-- RECUPERAÇÃO -->



<a href="recuperar-senha.html"

class="forgot-password">


<i class="fa-solid fa-key"></i>


Esqueci minha senha


</a>







</div>






</main>







<!-- ================================================
RODAPÉ
================================================ -->


<footer class="login-footer">


<strong>

EMPIRE ERP

</strong>


<span>

Sistema de Gestão | Império da Moda Online

</span>



</footer>









<!-- ================================================
SCRIPTS
================================================ -->


<script src="assets/js/login.js"></script>








<!-- ================================================
PARTÍCULAS ANIMADAS
================================================ -->


<script>


const particles = document.getElementById(

"particles"

);





if(particles){



for(let i = 0; i < 35; i++){



const particle = document.createElement(

"span"

);




particle.className = "particle";



particle.style.left =

Math.random()*100 + "%";



particle.style.animationDelay =

Math.random()*10 + "s";



particle.style.animationDuration =

(5 + Math.random()*10) + "s";





particles.appendChild(

particle

);



}



}





</script>









<!-- ================================================
PWA
================================================ -->


<script>


if("serviceWorker" in navigator){



window.addEventListener(

"load",

()=>{



navigator.serviceWorker.register(

"service-worker.js"

)

.then(()=>{


console.log(

"EMPIRE ERP PWA ativo"

);



})

.catch(error=>{


console.error(

"Erro PWA:",

error

);



});



}



);




}



</script>








</body>

</html>
