<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#050505">

<meta name="description" content="EMPIRE ERP - Recuperação de Senha">

<title>EMPIRE ERP | Recuperação de Senha</title>

<link rel="icon" href="assets/img/favicon.png">

<!-- Fontes -->
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Ícones -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- CSS -->
<link rel="stylesheet"
href="assets/css/recuperar-senha.css">

</head>

<body>

<!-- LOADER -->

<div class="loader" id="loader">

<div class="loader-content">

<div class="loader-logo">

EMPIRE

</div>

<div class="loader-subtitle">

Império da Moda Online

</div>

<div class="loader-bar">

<span></span>

</div>

</div>

</div>

<!-- FUNDO -->

<div class="background-animation">

<div class="glow glow-1"></div>

<div class="glow glow-2"></div>

<div class="glow glow-3"></div>

<div id="particles"></div>

</div>

<!-- CONTAINER -->

<main class="recovery-container">

<div class="recovery-card">

<div class="brand">

<h1>EMPIRE</h1>

<span>Império da Moda Online</span>

</div>

<h2>

Recuperação de Senha

</h2>

<p>

Informe seu usuário para iniciar a recuperação.

</p>

<form id="recoveryForm">
  <!-- ================================================
USUÁRIO
================================================ -->

<div class="input-group">

<i class="fa-solid fa-user"></i>

<input
type="text"
id="recoveryUser"
placeholder="Usuário"
autocomplete="username"
required>

</div>

<button
type="button"
class="primary-button"
id="searchUserButton">

<i class="fa-solid fa-magnifying-glass"></i>

<span>Localizar Usuário</span>

</button>





<!-- ================================================
INFORMAÇÕES DO USUÁRIO
================================================ -->

<div
class="user-information hidden"
id="userInformation">

<div class="info-row">

<strong>Usuário:</strong>

<span id="infoUser">-</span>

</div>

<div class="info-row">

<strong>Cargo:</strong>

<span id="infoRole">-</span>

</div>

<div class="info-row">

<strong>Status:</strong>

<span id="infoStatus">Aguardando</span>

</div>

</div>






<!-- ================================================
AUTORIZAÇÃO ADMINISTRADOR
================================================ -->

<div
class="authorization-box hidden"
id="authorizationBox">

<h3>

Autorização do Administrador

</h3>

<div class="input-group">

<i class="fa-solid fa-user-shield"></i>

<input
type="text"
id="adminUser"
placeholder="Usuário Administrador">

</div>

<div class="input-group">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="adminPassword"
placeholder="Senha do Administrador">

<button
type="button"
class="show-password"
id="toggleAdminPassword">

<i class="fa-solid fa-eye"></i>

</button>

</div>

<button
type="button"
class="gold-button"
id="authorizeButton">

Autorizar

</button>

</div>







<!-- ================================================
ALTERAÇÃO DE SENHA
================================================ -->

<div
class="password-box hidden"
id="passwordBox">

<div class="input-group">

<i class="fa-solid fa-key"></i>

<input
type="password"
id="newPassword"
placeholder="Nova senha">

<button
type="button"
class="show-password"
id="toggleNewPassword">

<i class="fa-solid fa-eye"></i>

</button>

</div>

<div class="password-strength">

<div
class="strength-bar"
id="strengthBar">

</div>

</div>

<small
id="strengthText">

Força da senha

</small>

<div class="input-group">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="confirmPassword"
placeholder="Confirmar senha">

</div>

<button
type="submit"
class="success-button">

Salvar Nova Senha

</button>

</div>






<div
class="message-box"
id="messageBox">

</div>






<a
href="index.html"
class="back-login">

<i class="fa-solid fa-arrow-left"></i>

Voltar para o Login

</a>
</form>

</div>

</main>

<!-- ================================================
RODAPÉ
================================================ -->

<footer class="login-footer">

<div>

<strong>

EMPIRE ERP

</strong>

</div>

<div>

Império da Moda Online

</div>

</footer>






<!-- ================================================
JAVASCRIPT
================================================ -->

<script src="assets/js/login.js"></script>

<script src="assets/js/recuperar-senha.js"></script>






<!-- ================================================
PARTÍCULAS
================================================ -->

<script>

const particles = document.getElementById("particles");

if(particles){

for(let i=0;i<35;i++){

const particle=document.createElement("span");

particle.className="particle";

particle.style.left=Math.random()*100+"%";

particle.style.animationDelay=Math.random()*8+"s";

particle.style.animationDuration=(5+Math.random()*8)+"s";

particles.appendChild(particle);

}

}

</script>






<!-- ================================================
SERVICE WORKER
================================================ -->

<script>

if("serviceWorker" in navigator){

window.addEventListener("load",()=>{

navigator.serviceWorker

.register("service-worker.js")

.then(()=>{

console.log("EMPIRE ERP PWA ativo");

})

.catch(error=>{

console.error(error);

});

});

}

</script>

</body>

</html>
