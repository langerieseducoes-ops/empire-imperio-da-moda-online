<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<meta name="theme-color" content="#050505">


<meta name="description" content="EMPIRE | Império da Moda Online">


<title>EMPIRE | Império da Moda Online</title>




<link rel="icon" href="../../assets/img/favicon.png">





<!-- FONTES -->

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">





<!-- ÍCONES -->

<link rel="stylesheet"

href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">





<!-- CSS -->

<link rel="stylesheet" href="../../assets/css/recuperar-senha.css">



</head>







<body>






<!-- ==================================================
LOADER
================================================== -->


<div class="loader" id="loader">



<div class="loader-content">



<div class="loader-logo">

EMPIRE

</div>




<div class="loader-subtitle">

Império da Moda Online

</div>




<div class="loader-line">

<span></span>

</div>



</div>



</div>







<!-- ==================================================
FUNDO
================================================== -->


<div class="background-animation">


<div class="glow glow-1"></div>

<div class="glow glow-2"></div>

<div class="glow glow-3"></div>


</div>









<!-- ==================================================
RECUPERAÇÃO
================================================== -->


<main class="recover-container">





<section class="recover-card">





<div class="recover-brand">



<img src="../../assets/img/logo.png"

alt="Logo Empire">






<h1>

EMPIRE

</h1>




<span>

Império da Moda Online

</span>




</div>





<!-- ==================================================
FORMULÁRIO RECUPERAÇÃO
================================================== -->


<form id="recoverForm" class="recover-form">







<div class="input-group">



<label>

Usuário

</label>





<div class="input-box">



<i class="fa-solid fa-user"></i>




<input

type="text"

id="recoverUser"

placeholder="Digite seu usuário"

required>



</div>



</div>









<div class="input-group">



<label>

Cargo

</label>





<div class="input-box">



<i class="fa-solid fa-user-shield"></i>






<select id="recoverCargo" required>



<option value="">

Selecione o cargo

</option>



<option value="Administrador">

Administrador

</option>




<option value="Gerente">

Gerente

</option>




<option value="Vendedor">

Vendedor

</option>



</select>





</div>



</div>









<div class="input-group">



<label>

Nova senha

</label>





<div class="input-box">



<i class="fa-solid fa-lock"></i>





<input

type="password"

id="newPassword"

placeholder="Digite a nova senha"

required>



</div>



</div>









<div class="input-group">



<label>

Confirmar senha

</label>





<div class="input-box">



<i class="fa-solid fa-lock"></i>





<input

type="password"

id="confirmPassword"

placeholder="Confirme a nova senha"

required>



</div>



</div>









<button

type="submit"

class="recover-button">





<i class="fa-solid fa-key"></i>




Recuperar senha





</button>








<div id="recoverMessage" class="recover-message">

</div>









<a class="back-login"

href="../../index.html">



<i class="fa-solid fa-arrow-left"></i>


Voltar para login



</a>







</form>






<!-- ==================================================
SCRIPTS
================================================== -->


<script src="../../assets/js/recuperar-senha.js"></script>









<!-- ==================================================
PWA SERVICE WORKER
================================================== -->


<script>


if("serviceWorker" in navigator){



window.addEventListener(

"load",

()=>{



navigator.serviceWorker.register(

"../../service-worker.js"

)

.then(()=>{


console.log(

"EMPIRE ERP PWA ativo"

);



})

.catch(error=>{


console.error(

"Erro PWA:",

error

);



});



}



);



}



</script>








</body>


</html>
